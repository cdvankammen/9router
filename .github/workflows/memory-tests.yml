name: Memory Unit Tests

on:
  pull_request:
    paths:
      - 'open-sse/services/memory/**'
      - 'tests/unit/memory-enhancements.test.js'

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    name: Memory Enhancement Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run memory unit tests
        run: node --test tests/unit/memory-enhancements.test.js
